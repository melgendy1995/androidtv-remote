[package]
name = "androidtv-remote"
version = "0.1.0"
description = "Cinema-style Android TV remote for macOS and Windows"
authors = ["Mahmoud Elgendy"]
edition = "2021"

[lib]
name = "androidtv_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "io-std"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rand = "0.8"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["clock"] }
bytes = "1"
base64 = "0.22"
which = "7"
