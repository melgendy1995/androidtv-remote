[package]
name = "androidtv-remote"
version = "0.1.0"
description = "Cinema-style Android TV remote for macOS and Windows"
authors = ["Mahmoud Elgendy"]
edition = "2021"

[lib]
name = "androidtv_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "io-std"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rand = "0.8"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["clock"] }
bytes = "1"
base64 = "0.22"
which = "7"
tauri-plugin-dialog = "2.7.2"
# TLS MITM (built-in proxy): terminate the TV's CONNECT tunnel and forward
# over a normal TLS client connection.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
flate2 = "1"
time = "0.3"
p12-keystore = "0.3.1"
